{% extends 'base.html' %}
{% block title %}Login - ComplaintPortal{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="panel p-4">
                <h3 class="mb-1">Login</h3>
                <p class="text-muted mb-4">Use your ACEM college email.</p>
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="your@acem.edu.in" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">Don't have an account? <a href="/register">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
