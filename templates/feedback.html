{% extends 'base.html' %}
{% block title %}Give Feedback - ComplaintPortal{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="panel p-4">
                <h3 class="mb-3">Give feedback</h3>
                <p class="mb-1"><strong>Complaint:</strong> {{ complaint.title }}</p>
                <p class="mb-3"><strong>Location:</strong> {{ complaint.location }}</p>
                <hr>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Rating</label>
                        <select name="rating" class="form-select star-select" required>
                            <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; Excellent</option>
                            <option value="4">&#9733;&#9733;&#9733;&#9733; Good</option>
                            <option value="3">&#9733;&#9733;&#9733; Average</option>
                            <option value="2">&#9733;&#9733; Poor</option>
                            <option value="1">&#9733; Very poor</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Comment (optional)</label>
                        <textarea name="comment" class="form-control" rows="4" placeholder="Share your experience..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-accent w-100">Submit feedback</button>
                </form>
                <p class="text-center mt-3 mb-0"><a href="/my-complaints">Back to my complaints</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
