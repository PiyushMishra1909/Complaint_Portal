{% extends 'base.html' %}
{% block title %}Submit Complaint - ComplaintPortal{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="panel p-4">
                <h3 class="mb-1">Submit a complaint</h3>
                <p class="text-muted mb-4">Give as much detail as you can — it helps get the right worker assigned faster.</p>
                <form method="POST" action="/submit-complaint" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" placeholder="Brief title of the issue" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="">-- Select Category --</option>
                            <option value="Electrical">Electrical</option>
                            <option value="Plumbing">Plumbing</option>
                            <option value="Cleaning">Cleaning</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Internet">Internet</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" placeholder="e.g. Block A, Room 204" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4" placeholder="Describe the issue in detail" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Upload photo (optional)</label>
                        <input type="file" name="photo" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-accent w-100">Submit complaint</button>
                </form>
                <p class="text-center mt-3 mb-0"><a href="/student/dashboard">Back to dashboard</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
